<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClotheMe - Terminal Multi-Casillero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --locker-color: #2c3e50;
            --locker-border: #1a252f;
            --screen-bg: #0a0a0a;
            --accent: #3498db;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Roboto Mono', monospace;
            overflow-x: hidden;
        }

        .locker-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
            perspective: 2000px;
        }

        .locker-case {
            position: relative;
            width: 320px;
            height: 600px;
            background: var(--locker-color);
            border: 10px solid var(--locker-border);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .compartment-interior {
            position: absolute;
            inset: 0;
            background: #000;
            background-image: linear-gradient(45deg, #050505 25%, #0a0a0a 25%, #0a0a0a 50%, #050505 50%, #050505 75%, #0a0a0a 75%, #0a0a0a 100%);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .item-placeholder {
            font-size: 6rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .locker-door {
            position: absolute;
            inset: -2px;
            background: var(--locker-color);
            border: 3px solid var(--locker-border);
            border-radius: 6px;
            z-index: 20;
            transform-origin: left;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .locker-door.open {
            transform: rotateY(-110deg);
        }

        .control-panel {
            background: var(--screen-bg);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .status-led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .led-wait { background: #f1c40f; box-shadow: 0 0 5px #f1c40f; }
        .led-active { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; animation: blink 1s infinite; }
        .led-error { background: #e74c3c; box-shadow: 0 0 5px #e74c3c; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Admin / Config Styles */
        .admin-sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: #1a1a1a;
            border-right: 1px solid #333;
            z-index: 1000;
            transition: left 0.3s ease;
        }
        .admin-sidebar.open { left: 0; }
        .admin-toggle {
            position: absolute;
            right: -45px;
            top: 20px;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }

        .config-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Sidebar Admin -->
    <div id="admin-sidebar" class="admin-sidebar">
        <button onclick="toggleAdmin()" class="admin-toggle">📊</button>
        <div class="p-6">
            <h2 class="text-xl font-bold text-blue-500 mb-6 font-[Orbitron]">CONTROL</h2>
            <button onclick="seedLockers()" class="w-full bg-blue-600 mb-2 py-2 rounded text-xs font-bold uppercase">Reiniciar Sistema</button>
            <button onclick="refreshData()" class="w-full bg-gray-800 mb-6 py-2 rounded text-xs font-bold uppercase">Actualizar Estados</button>
            
            <div id="admin-info" class="space-y-4">
                <p class="text-[10px] text-gray-500 text-center italic">Cargando datos...</p>
            </div>
        </div>
    </div>

    <!-- Configuración -->
    <button onclick="toggleConfig()" class="config-btn bg-gray-800 p-3 rounded-full border border-gray-600">⚙️</button>
    <div id="config-panel" class="hidden fixed top-20 right-20 bg-[#1a1a1a] p-6 rounded-lg border border-gray-700 z-[200] w-64 shadow-2xl">
        <h3 class="text-sm font-bold text-blue-400 mb-4 uppercase">Configuración</h3>
        <div class="space-y-4 text-[10px]">
            <div>
                <label class="block text-gray-400 mb-1">Backend URL</label>
                <input type="text" id="apiUrl" value="http://localhost:3000" class="w-full bg-black border border-gray-700 rounded p-2">
            </div>
            <div>
                <label class="block text-gray-400 mb-1">API Key</label>
                <input type="password" id="apiKey" value="clotheme_secret_iot_token_2024" class="w-full bg-black border border-gray-700 rounded p-2">
            </div>
            <div>
                <label class="block text-gray-400 mb-1">Admin Token</label>
                <input type="password" id="adminToken" placeholder="Pegar token aquí..." class="w-full bg-black border border-gray-700 rounded p-2">
            </div>
        </div>
    </div>

    <!-- Área de Casilleros -->
    <div class="locker-container">
        
        <!-- Casillero 1 -->
        <div class="locker-case" id="locker-A">
            <div class="compartment-interior">
                <div id="item-A" class="item-placeholder">📦</div>
                <div class="mt-4 text-center px-4">
                    <p id="msg-A" class="text-blue-400 font-bold text-xs uppercase">Esperando...</p>
                    <button onclick="closeLocker('A')" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-full text-[10px] font-bold">CERRAR</button>
                </div>
            </div>
            <div class="locker-door" id="door-A">
                <div class="control-panel">
                    <h1 class="text-center font-bold text-sm mb-4 font-[Orbitron]">CLOTHE-ME</h1>
                    <div class="bg-black/50 p-2 rounded border border-gray-800 mb-4">
                        <div class="flex items-center text-[10px]">
                            <span id="led-A" class="status-led led-wait"></span>
                            <span id="status-text-A">LISTO</span>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col justify-end gap-2">
                        <input type="text" id="input-A" placeholder="CÓDIGO NUMÉRICO..." class="bg-black border border-gray-800 rounded p-2 text-[10px] outline-none text-green-500">
                        <button onclick="verify('A')" class="bg-blue-600 py-2 rounded text-[10px] font-bold uppercase">Ingresar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Casillero 2 -->
        <div class="locker-case" id="locker-B">
            <div class="compartment-interior">
                <div id="item-B" class="item-placeholder">📦</div>
                <div class="mt-4 text-center px-4">
                    <p id="msg-B" class="text-blue-400 font-bold text-xs uppercase">Esperando...</p>
                    <button onclick="closeLocker('B')" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-full text-[10px] font-bold">CERRAR</button>
                </div>
            </div>
            <div class="locker-door" id="door-B">
                <div class="control-panel">
                    <h1 class="text-center font-bold text-sm mb-4 font-[Orbitron]">CLOTHE-ME</h1>
                    <div class="bg-black/50 p-2 rounded border border-gray-800 mb-4">
                        <div class="flex items-center text-[10px]">
                            <span id="led-B" class="status-led led-wait"></span>
                            <span id="status-text-B">LISTO</span>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col justify-end gap-2">
                        <input type="text" id="input-B" placeholder="CÓDIGO NUMÉRICO..." class="bg-black border border-gray-800 rounded p-2 text-[10px] outline-none text-green-500">
                        <button onclick="verify('B')" class="bg-blue-600 py-2 rounded text-[10px] font-bold uppercase">Ingresar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function toggleAdmin() { document.getElementById('admin-sidebar').classList.toggle('open'); if(document.getElementById('admin-sidebar').classList.contains('open')) refreshData(); }
        function toggleConfig() { document.getElementById('config-panel').classList.toggle('hidden'); }

        async function verify(side) {
            const code = document.getElementById(`input-${side}`).value;
            const apiUrl = document.getElementById('apiUrl').value;
            const apiKey = document.getElementById('apiKey').value;

            if (!code) return;

            updateStatus(side, 'active', 'VALIDANDO...');

            try {
                const response = await fetch(`${apiUrl}/api/locker/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scannedCode: code, apiKey: apiKey })
                });

                const data = await response.json();

                if (data.access) {
                    openLocker(side, data);
                    
                    // Simular notificación en la app
                    if (data.action === 'open_for_deposit') {
                        const otherUser = side === 'A' ? 'B' : 'A';
                        setTimeout(() => {
                            alert(`🔔 [APP NOTIFICACIÓN]: ¡El Usuario ${side} ha depositado su prenda! Se ha notificado al Usuario ${otherUser}.`);
                        }, 2000);
                    }
                } else {
                    const errorMsg = data.error || data.message || 'ACCESO DENEGADO';
                    updateStatus(side, 'error', errorMsg);
                    alert(errorMsg);
                }
            } catch (err) {
                updateStatus(side, 'error', 'ERROR RED');
            }
        }

        function openLocker(side, data) {
            // Decidir en qué casillero físico se abre (el backend nos da el ID como L01, L02...)
            // Para el tester, asumimos que A es para la primera acción y B para la segunda si es necesario
            // o simplemente usamos el lado donde se escaneó.
            
            const targetSide = side; // Por simplicidad usamos el mismo lado del input
            document.getElementById(`door-${targetSide}`).classList.add('open');
            document.getElementById(`item-${targetSide}`).innerText = data.item || '👕';
            document.getElementById(`msg-${targetSide}`).innerText = data.message;
            updateStatus(targetSide, 'active', 'ABIERTO');
        }

        function closeLocker(side) {
            document.getElementById(`door-${side}`).classList.remove('open');
            document.getElementById(`input-${side}`).value = '';
            updateStatus(side, 'wait', 'LISTO');
            if(document.getElementById('admin-sidebar').classList.contains('open')) refreshData();
        }

        function updateStatus(side, type, text) {
            document.getElementById(`led-${side}`).className = `status-led led-${type}`;
            document.getElementById(`status-text-${side}`).innerText = text;
        }

        // Admin Functions
        async function refreshData() {
            const apiUrl = document.getElementById('apiUrl').value;
            const token = document.getElementById('adminToken').value;
            const info = document.getElementById('admin-info');

            try {
                const response = await fetch(`${apiUrl}/api/locker/all`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                let html = '<div class="space-y-4">';
                
                // Casilleros
                html += '<div><h4 class="text-[8px] text-gray-500 uppercase mb-2">Casilleros</h4><div class="grid grid-cols-2 gap-2">';
                Object.keys(data.lockers || {}).forEach(id => {
                    const l = data.lockers[id];
                    html += `<div class="bg-black p-2 rounded border border-gray-800 text-[8px]">
                        <span class="text-blue-400 font-bold">${id}</span>: 
                        <span class="${l.status === 'AVAILABLE' ? 'text-green-500' : 'text-yellow-500'}">${l.status}</span>
                    </div>`;
                });
                html += '</div></div>';

                // Intercambios
                html += '<div><h4 class="text-[8px] text-gray-500 uppercase mb-2">Intercambios Activos</h4>';
                Object.keys(data.activeExchanges || {}).forEach(id => {
                    const e = data.activeExchanges[id];
                    html += `<div class="bg-gray-900 p-3 rounded border border-gray-700 text-[9px] mb-3">
                        <p class="text-blue-500 font-bold mb-2">EXCHANGE ID: ${id.substring(0,8)}</p>
                        <div class="space-y-2">
                            <div class="flex justify-between items-center bg-black/40 p-1 rounded">
                                <span class="text-gray-400">CODE USER A:</span>
                                <span class="text-green-400 font-mono font-bold select-all">${e.codeA}</span>
                            </div>
                            <div class="flex justify-between items-center bg-black/40 p-1 rounded">
                                <span class="text-gray-400">CODE USER B:</span>
                                <span class="text-green-400 font-mono font-bold select-all">${e.codeB}</span>
                            </div>
                        </div>
                        <div class="flex justify-between text-[7px] text-gray-500 mt-2 uppercase">
                            <span>Status A: ${e.statusA}</span>
                            <span>Status B: ${e.statusB}</span>
                        </div>
                    </div>`;
                });
                html += '</div></div>';

                info.innerHTML = html;
            } catch (err) {
                info.innerHTML = '<p class="text-red-500 text-[8px]">Error al conectar. Revisa el token.</p>';
            }
        }

        async function seedLockers() {
            const apiUrl = document.getElementById('apiUrl').value;
            const token = document.getElementById('adminToken').value;
            try {
                await fetch(`${apiUrl}/api/locker/seed`, { headers: { 'Authorization': `Bearer ${token}` } });
                alert('Sistema Reiniciado');
                refreshData();
            } catch (err) { alert('Error'); }
        }
    </script>
</body>
</html>
